# Runs `kamal deploy` after the CI workflow passes on main.
#
# Setup:
#
# 1. Fill in config/deploy.yml and run `kamal setup` once from your machine.
#    This workflow only deploys, it does not provision servers.
#
# 2. Make an SSH key for deploys and put the public half on your servers:
#      ssh-keygen -t ed25519 -C github-actions -f ~/.ssh/kamal_deploy -N ""
#      ssh-copy-id -i ~/.ssh/kamal_deploy.pub root@YOUR_SERVER_IP
#
# 3. Add these under Settings -> Secrets and variables -> Actions -> New repository secret:
#      SSH_PRIVATE_KEY          contents of ~/.ssh/kamal_deploy (private half, BEGIN/END lines included)
#      RAILS_MASTER_KEY         contents of config/credentials/production.key (or config/master.key)
#      KAMAL_REGISTRY_PASSWORD  registry access token
#
# Notes:
#
# - "CI" below is the `name:` in .github/workflows/ci.yml, change it if you rename that workflow.
# - workflow_run fires when CI fails too, hence the conclusion check on the job.
# - Change `branches: [main]` if you deploy from another branch.
# - Deploy by hand from the Actions tab with the "Run workflow" button.

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - run: gem install kamal

      - uses: docker/setup-buildx-action@v3

      # Kamal talks to the servers over net-ssh, which picks the key up from the agent.
      # No known_hosts step needed, net-ssh accepts unseen host keys by default.
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: bundle exec kamal deploy
